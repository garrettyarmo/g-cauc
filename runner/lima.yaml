# A g-cauc runner VM: a Linux machine on the Mac that runs one repo's CI jobs in throwaway
# containers. gcauc-runner makes one VM per repo from this file, with the CPUs and memory
# that runner/repos gives that repo (the values below are only defaults).
# No host mounts (jobs never see ~/.config, ~/.aws, ~/.ssh), no port forwarding to the Mac
# (job services never collide with a worktree's dev ports), no SSH agent forwarding.
minimumLimaVersion: 2.0.0
base:
- template:_images/ubuntu-24.04
vmType: vz
cpus: 4
memory: 4GiB
disk: 100GiB
mounts: []
ssh:
  forwardAgent: false
  loadDotSSHPubKeys: false
portForwards:
- guestPortRange: [1, 65535]
  guestIP: 0.0.0.0
  ignore: true
- guestPortRange: [1, 65535]
  guestIP: 127.0.0.1
  ignore: true
containerd:
  system: false
  user: false
provision:
# One time source: the host's clock. Lima's guest agent steps the guest clock to the host's clock when
# they differ by more than 100 ms, and Lima has no setting to turn that off. systemd-timesyncd steered
# the same clock to ntp.ubuntu.com, so the two fought: over 300 steps back per VM on 2026-10-12, which
# failed CallFlow tests that order events by wall clock. Mask timesyncd, then clear the frequency and the
# offset that it left in the kernel (they outlive it), as at boot. Lima runs this at every boot.
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    systemctl mask --now systemd-timesyncd
    python3 - <<'PY'
    import ctypes
    class Timex(ctypes.Structure):  # struct timex: the fields used here, then room for the rest
        _fields_ = [("modes", ctypes.c_uint), ("offset", ctypes.c_long), ("freq", ctypes.c_long),
                    ("maxerror", ctypes.c_long), ("esterror", ctypes.c_long), ("status", ctypes.c_int),
                    ("rest", ctypes.c_byte * 200)]
    libc = ctypes.CDLL(None, use_errno=True)
    ADJ_OFFSET, ADJ_FREQUENCY, ADJ_MAXERROR, ADJ_ESTERROR, ADJ_STATUS, STA_UNSYNC = 0x1, 0x2, 0x4, 0x8, 0x10, 0x40
    # The offset first: the kernel takes it only while its PLL is on, and the second call turns the PLL off.
    # timedatectl reports "synchronized" while the error bound is under its limit of 16 s, so set the limit (µs).
    reset = Timex(modes=ADJ_STATUS | ADJ_FREQUENCY | ADJ_MAXERROR | ADJ_ESTERROR, status=STA_UNSYNC,
                  maxerror=16000000, esterror=16000000)
    for t in (Timex(modes=ADJ_OFFSET), reset):
        if libc.adjtimex(ctypes.byref(t)) < 0:
            raise OSError(ctypes.get_errno(), "adjtimex")
    PY
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    if ! command -v docker >/dev/null 2>&1; then
      apt-get update
      apt-get install -y --no-install-recommends docker.io docker-compose-v2 docker-buildx
    fi
    # Wide address pools: every job's compose project gets its own network.
    mkdir -p /etc/docker
    cat >/etc/docker/daemon.json <<'JSON'
    {"default-address-pools": [{"base": "10.200.0.0/14", "size": 24}], "log-driver": "local"}
    JSON
    usermod -aG docker "{{.User}}"
    systemctl enable docker
    systemctl restart docker
probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    timeout 120s bash -c 'until sudo docker info >/dev/null 2>&1; do sleep 3; done'
  hint: See /var/log/cloud-init-output.log in the guest
